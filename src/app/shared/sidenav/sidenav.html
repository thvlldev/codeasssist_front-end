<mat-sidenav-container class="sidenav-container">

  <mat-sidenav mode="side" opened class="sidenav">

    <!-- HEADER -->
    <div class="sidenav-header">
      <img src="assets/logo.png" alt="Logo" height="55">
    </div>

    <mat-divider></mat-divider>

    <!-- MENU PRINCIPAL -->
    <mat-nav-list>
      <p class="menu-label">Menu Principal</p>

      <a mat-list-item routerLink="/app/dashboard" routerLinkActive="menu-ativo">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/app/publicacoes" routerLinkActive="menu-ativo">
        <mat-icon matListItemIcon>article</mat-icon>
        <span matListItemTitle>Publicações</span>
      </a>

      <a mat-list-item routerLink="/app/nova-publicacao" routerLinkActive="menu-ativo">
        <mat-icon matListItemIcon>add_circle_outline</mat-icon>
        <span matListItemTitle>Nova Publicação</span>
      </a>

      <a mat-list-item routerLink="/app/mensagens" routerLinkActive="menu-ativo">
        <mat-icon matListItemIcon>chat_bubble_outline</mat-icon>
        <span matListItemTitle>Mensagens</span>
      </a>

      <a mat-list-item routerLink="/app/perfil" routerLinkActive="menu-ativo">
        <mat-icon matListItemIcon>person_outline</mat-icon>
        <span matListItemTitle>Meu Perfil</span>
      </a>

    </mat-nav-list>

    <!-- RODAPÉ DO MENU -->
    <div class="sidenav-footer">
      <mat-divider></mat-divider>
      <mat-nav-list>

        <a mat-list-item routerLink="/app/notificacoes" routerLinkActive="menu-ativo">
          <mat-icon matListItemIcon>notifications_none</mat-icon>
          <span matListItemTitle>Notificações</span>
        </a>

        <a mat-list-item (click)="sair()">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Sair</span>
        </a>

      </mat-nav-list>
    </div>

  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

<div>
  <app-footer></app-footer>
</div>

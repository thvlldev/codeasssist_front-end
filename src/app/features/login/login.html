<div class="d-flex align-items-center justify-content-center px-3 py-3">

  <div class="w-100" style="max-width: 400px;">

    <div class="card border-0 rounded-4 p-4"
         style="box-shadow: 0 4px 24px rgba(0,0,0,0.07);">

      <!-- Header -->
      <div class="text-center mb-4">
        <div class="fw-bold mb-3" style="font-size: 18px; color: #0D7377; letter-spacing: -0.5px;">
          Code<span class="text-dark">Assist</span>
        </div>

        <h1 class="h5 fw-bold text-dark mb-1">
          Bem-vindo de volta
        </h1>

        <p class="text-secondary small mb-0">
          Entre na sua conta para continuar
        </p>
      </div>

      <!-- Seletor de Papel -->
      <div class="mb-3">
        <label class="form-label small fw-medium text-secondary">Entrar como</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="papel" id="papelCliente" autocomplete="off"
                 [value]="TipoUsuario.Cliente" [(ngModel)]="loginData.papel">
          <label class="btn btn-outline-secondary" for="papelCliente" [class.papel-ativo]="loginData.papel === TipoUsuario.Cliente">
            <i class="bi bi-mortarboard"></i> Cliente
          </label>

          <input type="radio" class="btn-check" name="papel" id="papelMentor" autocomplete="off"
                 [value]="TipoUsuario.Mentor" [(ngModel)]="loginData.papel">
          <label class="btn btn-outline-secondary" for="papelMentor" [class.papel-ativo]="loginData.papel === TipoUsuario.Mentor">
            <i class="bi bi-person-workspace"></i> Mentor
          </label>
        </div>
      </div>

      @if (erroMsg) {
        <div class="alert alert-danger small py-2" role="alert">{{ erroMsg }}</div>
      }

      <!-- Social Login -->
      <div class="d-grid gap-2 mb-3">

        <button
          (click)="handleGoogleLogin()"
          class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2 py-2 rounded-3"
          style="font-size: 14px; font-weight: 500;"
        >
          <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            width="18"
            alt="Google"
          >
          Continuar com Google
        </button>

        <button
          (click)="handleGithubLogin()"
          class="btn btn-github d-flex align-items-center justify-content-center gap-2 py-2 rounded-3"
          style="background: #1a1a1a; color: #fff; border-color: #1a1a1a; font-size: 14px; font-weight: 500;"
        >
          <i class="bi bi-github fs-5"></i>
          Continuar com GitHub
        </button>

      </div>

      <!-- Divider -->
      <div class="d-flex align-items-center gap-2 my-3">
        <hr class="flex-grow-1 my-0">

        <span
          class="text-muted"
          style="font-size: 12px; white-space: nowrap;"
        >
          Ou continue com e-mail
        </span>

        <hr class="flex-grow-1 my-0">
      </div>

      <!-- Form -->
      <form (ngSubmit)="handleSubmit()" #loginForm="ngForm">

        <div class="mb-3">

          <label
            for="email"
            class="form-label small fw-medium text-secondary"
          >
            E-mail
          </label>

          <div
            class="input-group rounded-3 overflow-hidden"
            style="border: 1px solid #dee2e6;"
          >

            <span class="input-group-text bg-white border-0 text-muted">
              <i class="bi bi-envelope"></i>
            </span>

            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="loginData.email"
              required
              class="form-control border-0 ps-0 shadow-none"
              placeholder="seu@email.com"
            >

          </div>
        </div>

        <div class="mb-3">

          <label
            for="password"
            class="form-label small fw-medium text-secondary"
          >
            Senha
          </label>

          <div
            class="input-group rounded-3 overflow-hidden"
            style="border: 1px solid #dee2e6;"
          >

            <span class="input-group-text bg-white border-0 text-muted">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="loginData.password"
              required
              class="form-control border-0 ps-0 shadow-none"
              placeholder="••••••••"
            >

          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">

          <div class="form-check mb-0">

            <input
              type="checkbox"
              class="form-check-input"
              id="remember"
              name="rememberMe"
              [(ngModel)]="loginData.rememberMe"
              style="accent-color: #0D7377;"
            >

            <label
              class="form-check-label small text-secondary"
              for="remember"
            >
              Lembrar de mim
            </label>

          </div>

          <a
            href="#"
            class="small text-decoration-none fw-medium"
            style="color: #0D7377;"
          >
            Esqueceu a senha?
          </a>

        </div>

        <button
          type="submit"
          [disabled]="!loginForm.valid || enviando"
          class="btn w-100 py-2 fw-bold text-white rounded-3"
          style="background: #0D7377; border: none; font-size: 15px; letter-spacing: 0.1px;"
        >
          {{ enviando ? 'Entrando...' : 'Entrar' }}
        </button>

      </form>

      <p class="mt-4 text-center small text-secondary mb-0">

        Não tem uma conta?

        <a
          (click)="abrirModalCadastro()"
          class="fw-bold text-decoration-none"
          style="color: #0D7377; cursor: pointer;"
        >
          Cadastre-se
        </a>

      </p>

    </div>
  </div>
</div>
